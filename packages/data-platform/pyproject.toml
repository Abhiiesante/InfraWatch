[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "infrawatch-data-platform"
version = "1.1.0"
description = "InfraWatch Data & AI Platform — Lakehouse, ML, CV, LLM/RAG"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyspark>=3.5.0",
    "delta-spark>=3.1.0",
    "mlflow>=2.10.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "xgboost>=2.0.0",
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "black>=24.1.0",
]
vision = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "ultralytics>=8.1.0",
    "Pillow>=10.2.0",
    "opencv-python>=4.9.0",
]
llm = [
    "openai>=1.10.0",
    "tiktoken>=0.5.0",
    "langchain-core>=0.1.0",
]
databricks = [
    "databricks-sdk>=0.17.0",
    "databricks-connect>=14.3.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "contracts*", "ingestion*", "pipelines*", "quality*",
           "features*", "ml*", "llm*", "serving*", "monitoring*", "common*"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
