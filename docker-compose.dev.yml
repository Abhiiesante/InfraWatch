version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: infrawatch-postgres
    environment:
      POSTGRES_USER: infrawatch
      POSTGRES_PASSWORD: infrawatch
      POSTGRES_DB: infrawatch_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U infrawatch']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: infrawatch-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
