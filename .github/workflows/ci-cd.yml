name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_infrawatch
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/backend/prisma/schema.prisma

      - name: Type checking
        run: npm run type-check

      - name: Lint
        env:
          DISABLE_TS_COMPAT_CHECK: "true"
          ESLINT_USE_FLAT_CONFIG: "false"
        run: npm run lint

      - name: Push DB Schema for Tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_infrawatch
        run: npx prisma db push --schema=packages/backend/prisma/schema.prisma

      - name: Run backend tests
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_infrawatch
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-minimum-32-characters-long-123456
          JWT_REFRESH_SECRET: test-refresh-secret-minimum-32-characters-long
          FRONTEND_URL: http://localhost:5173
        run: npm run test --workspace=@infrawatch/backend -- --run --maxConcurrency=1

      - name: Run frontend tests
        run: npm run test --workspace=@infrawatch/frontend -- --run

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/backend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}

      - name: Extract metadata (frontend)
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./packages/frontend/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta_frontend.outputs.tags }}
          labels: ${{ steps.meta_frontend.outputs.labels }}
          build-args: |
            VITE_API_URL=/api

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: infrawatch
          POSTGRES_PASSWORD: infrawatch
          POSTGRES_DB: infrawatch_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --schema=packages/backend/prisma/schema.prisma

      - name: Setup database
        env:
          DATABASE_URL: postgresql://infrawatch:infrawatch@localhost:5432/infrawatch_test
        run: |
          cd packages/backend
          npx prisma db push
          npx tsx src/db/seed.ts

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://infrawatch:infrawatch@localhost:5432/infrawatch_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test-secret-minimum-32-characters-long-123456
          JWT_REFRESH_SECRET: test-refresh-secret-minimum-32-characters-long
          FRONTEND_URL: http://localhost:5173
        run: npm run test --workspace=@infrawatch/backend -- --run

  notify:
    needs: [test, build]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Notify deployment
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ All checks passed - ready to deploy"
          else
            echo "❌ Pipeline completed"
          fi
